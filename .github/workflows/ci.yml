name: CI
# Build, lint, test, and prove fs-transaction on every push and pull request.
#
# There is deliberately almost nothing here. The jobs are the `job` list in
# .config/ship.figl, and ship is what reads it: the plan job asks `ship ci
# --matrix` for them, and each runner runs one as `ship ci <id>`. Changing CI —
# adding a job, renaming one, changing what a job runs — is an edit to that file
# alone, and `ship ci` runs the same jobs locally, in the same order, with the
# same shell.
#
# What the runner still owns is the toolchain, because only it knows how to
# install one: stable Rust and whatever a job's `runner` table asks for. Which
# machine a job runs on is the job's own, in that table: `barrier-fsync`
# compiles only on Apple platforms, so the job that tests it asks for a Mac.
on:
  push: { branches: [main] }
  pull_request: null
  workflow_dispatch: null

# Cancel superseded runs on the same ref — a new push makes the old one moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Ask ship what CI consists of.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - run: cargo install --locked --git https://github.com/diaryx-org/ship ship
    - id: plan
      run: echo "jobs=$(ship ci --matrix)" >> "$GITHUB_OUTPUT"

  # One runner per job in that table. `name` is the job's own, so these appear as
  # `CI / Format`, `CI / Clippy`, … — rename a job in ship.figl and the required
  # status check is renamed with it.
  run:
    name: ${{ matrix.job.name }}
    needs: plan
    # A field a job's runner table leaves out is null here, so a job that names
    # no machine gets Ubuntu.
    runs-on: ${{ matrix.job['runs-on'] || 'ubuntu-latest' }}
    strategy:
      # One red job should not hide the state of the others.
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with: { components: "${{ matrix.job.components }}" }
    # No components when the runner table names none, and the cache restored
    # unless the job says `builds = false`.
    - uses: Swatinem/rust-cache@v2
      if: matrix.job.builds != false
    - run: cargo install --locked --git https://github.com/diaryx-org/ship ship
    - run: ship ci ${{ matrix.job.id }}
