# `cargo xtask proofs`, the CI job that is a program. Not a published crate —
# `publish = false` keeps it out of any `cargo publish` sweep, and it
# deliberately has no dependencies: the job builds it before it can do
# anything, so the cost of building it is paid on every run.
[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
